services:

  - type: web

    name: dazy-backend

    runtime: python

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:

      - key: DATABASE_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: CHAT_MODEL
        value: gemini-3.6-flash

      - key: ENVIRONMENT
        value: production

      - key: FRONTEND_URLS
        sync: false

      - key: MEMORY_MESSAGES
        value: "12"